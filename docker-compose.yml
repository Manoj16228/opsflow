version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: opsflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsflow_admin
      POSTGRES_PASSWORD: opsflow_secure_password_2026
      POSTGRES_DB: opsflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsflow_admin -d opsflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Redis Caching & Queue Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: opsflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. OpsFlow Core REST API & Socket.IO Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: opsflow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://opsflow_admin:opsflow_secure_password_2026@postgres:5432/opsflow_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: opsflow_super_secret_jwt_access_token_key_2026_xyz987
      JWT_REFRESH_SECRET: opsflow_super_secret_jwt_refresh_token_key_2026_abc123
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: ./uploads
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  # ----------------------------------------------------------------------------
  # 4. OpsFlow Enterprise Frontend SPA
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: opsflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ----------------------------------------------------------------------------
  # 5. Python ETL Analytics Worker
  # ----------------------------------------------------------------------------
  etl:
    build:
      context: ./data-engineering
      dockerfile: ../docker/Dockerfile.etl
    container_name: opsflow-etl
    environment:
      DATABASE_URL: postgresql://opsflow_admin:opsflow_secure_password_2026@postgres:5432/opsflow_db?schema=public
      ANALYTICS_DATABASE_URL: postgresql://opsflow_admin:opsflow_secure_password_2026@postgres:5432/opsflow_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - etl-job

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
